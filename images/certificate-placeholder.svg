<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008080"/>
      <stop offset="1" stop-color="#20b2aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#004f4f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="url(#g)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="110" width="960" height="480" rx="24" fill="#ffffff" opacity="0.95"/>
    <rect x="160" y="150" width="880" height="400" rx="18" fill="#e0f2f1"/>
    <rect x="200" y="200" width="800" height="40" rx="10" fill="#ffffff"/>
    <rect x="200" y="270" width="640" height="24" rx="10" fill="#ffffff" opacity="0.92"/>
    <rect x="200" y="310" width="720" height="24" rx="10" fill="#ffffff" opacity="0.92"/>
    <rect x="200" y="350" width="560" height="24" rx="10" fill="#ffffff" opacity="0.92"/>
    <circle cx="940" cy="420" r="54" fill="#008080" opacity="0.15"/>
    <circle cx="940" cy="420" r="36" fill="#008080" opacity="0.25"/>
  </g>

  <text x="600" y="585" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="28" font-weight="700" fill="#ffffff" opacity="0.95">
    Certificate Placeholder
  </text>
  <text x="600" y="622" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" fill="#ffffff" opacity="0.9">
    Add your certificate image to the certificates/ folder and set its path in js/script.js
  </text>
</svg>
